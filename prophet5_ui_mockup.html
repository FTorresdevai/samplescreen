<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequential Prophet-5 UI Mockup - 2D Orthographic Vector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #08080a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px 12px;
      overflow-x: hidden;
    }

    /* 9:16 Aspect Ratio Frame Container */
    .viewport-frame {
      width: 100%;
      max-width: 540px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 35%, #15161b 0%, #08080a 75%);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), inset 0 0 100px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }

    /* Outer Synthesizer Chassis */
    .synth-chassis {
      width: 100%;
      background: #111215;
      position: relative;
      border-radius: 6px;
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.85),
        0 4px 10px rgba(0, 0, 0, 0.6),
        0 0 0 1px #050507;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Rich Mahogany Wood Side Panels */
    .wood-left, .wood-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 20;
      pointer-events: none;
      background: linear-gradient(90deg, 
        #2a0f07 0%, 
        #4c1e11 25%, 
        #652715 50%, 
        #3e160c 80%, 
        #230b05 100%
      );
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), inset 0 -1px 2px rgba(0, 0, 0, 0.8);
    }
    .wood-left {
      left: 0;
      border-right: 2px solid #140502;
      border-top-left-radius: 5px;
      border-bottom-left-radius: 5px;
    }
    .wood-right {
      right: 0;
      border-left: 2px solid #140502;
      border-top-right-radius: 5px;
      border-bottom-right-radius: 5px;
    }
    .wood-screw {
      width: 7px;
      height: 7px;
      background: radial-gradient(circle, #8a7a60 20%, #302a20 90%);
      border-radius: 50%;
      margin: 18px auto;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8), inset 0 0.5px 0.5px rgba(255,255,255,0.4);
      position: relative;
    }
    .wood-screw::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 1px;
      right: 1px;
      height: 1px;
      background: #15120c;
    }

    /* Dark Brushed Metal Faceplate */
    .faceplate {
      margin: 0 24px;
      background: 
        repeating-linear-gradient(90deg, 
          rgba(255,255,255,0.012) 0px, 
          rgba(255,255,255,0.012) 1px, 
          transparent 1px, 
          transparent 2px
        ),
        linear-gradient(180deg, #222328 0%, #17181c 40%, #141518 100%);
      padding: 16px 14px 12px 14px;
      position: relative;
      border-bottom: 2px solid #0d0e10;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    /* Silk-screen Header Badge */
    .synth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .logo-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: #b2bac2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .logo-model {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #e5e9f0;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-badge {
      background: #c53030;
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* Module Control Grids */
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .synth-section {
      background: rgba(15, 16, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    .section-title {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #8c96a5;
      text-align: center;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
    }

    .knobs-cluster {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 4px;
      align-items: center;
      justify-items: center;
    }

    /* Precision Orthographic Knob with Circular Markings */
    .knob-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .knob-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8e95a0;
      margin-top: 4px;
      font-weight: 600;
      text-align: center;
    }

    .knob-dial-wrap {
      width: 44px;
      height: 44px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .knob-ticks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .knob-body {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a3b42 0%, #1b1c20 60%, #121316 100%);
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.7),
        0 1px 2px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 2px rgba(0, 0, 0, 0.9);
      border: 1px solid #0d0e11;
      position: relative;
      cursor: pointer;
      transition: transform 0.08s ease-out;
    }
    .knob-body::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2e33 20%, #18191c 80%);
      border: 1px solid #101114;
    }
    .knob-indicator {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 1px;
      box-shadow: 0 0 2px rgba(255, 255, 255, 0.7);
    }

    /* Program Preset Bar with Blank LED Display */
    .preset-bar {
      grid-column: span 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f1013;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 6px 12px;
      margin-top: 8px;
    }
    .preset-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .blank-led-display {
      width: 72px;
      height: 28px;
      background: #180507;
      border: 1.5px solid #2d0b0f;
      border-radius: 3px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.05);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Dim unlit 7-segment ghost contours in resting state */
    .blank-led-display::after {
      content: "88";
      font-family: "Courier New", monospace, monospace;
      font-size: 22px;
      font-weight: bold;
      color: rgba(180, 20, 20, 0.08);
      letter-spacing: 4px;
    }
    .led-title {
      font-size: 8px;
      font-weight: 700;
      color: #7b8491;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .preset-buttons {
      display: flex;
      gap: 5px;
    }
    .synth-btn {
      width: 22px;
      height: 18px;
      background: linear-gradient(180deg, #33343a 0%, #1e1f23 100%);
      border: 1px solid #0e0f12;
      border-radius: 2px;
      box-shadow: 0 2px 3px rgba(0,0,0,0.6), inset 0 0.5px 0.5px rgba(255,255,255,0.25);
      color: #9aa0a6;
      font-size: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .synth-btn:hover {
      background: #3e4047;
      color: #ffffff;
    }
    .synth-btn.active {
      background: #991b1b;
      color: #fecaca;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.5), inset 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Lower Section: Wheels Recess + 3-Octave Piano Keyboard */
    .keyboard-shelf {
      margin: 0 24px;
      background: #0a0b0d;
      padding: 10px 10px 0 10px;
      display: flex;
      gap: 12px;
      border-top: 1px solid #1a1b20;
    }

    /* Pitch & Mod Wheels Bay */
    .wheels-bay {
      width: 58px;
      background: #070709;
      border-radius: 3px;
      border: 1px solid #18191f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.95);
    }
    .wheel-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .wheel {
      width: 20px;
      height: 70px;
      background: repeating-linear-gradient(180deg, 
        #2a2b30 0px, 
        #2a2b30 3px, 
        #121316 3px, 
        #121316 6px
      );
      border-radius: 3px;
      border: 1px solid #000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.9), inset 0 0 4px rgba(255,255,255,0.1);
      cursor: ns-resize;
    }
    .wheel-lbl {
      font-size: 7px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 3-Octave Piano Keyboard (37 Keys: 22 White, 15 Black) */
    .keyboard-container {
      flex: 1;
      height: 104px;
      position: relative;
      display: flex;
      background: #000;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.9);
      border-radius: 1px 1px 0 0;
      overflow: hidden;
    }

    .white-keys {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .key-white {
      flex: 1;
      background: linear-gradient(180deg, #f7f5f0 0%, #ebe7df 75%, #dfdacd 100%);
      border-right: 1px solid #bbb5a8;
      border-left: 1px solid #fffff9;
      border-bottom: 3px solid #8e887d;
      border-radius: 0 0 3px 3px;
      cursor: pointer;
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.9), 0 3px 5px rgba(0,0,0,0.3);
      position: relative;
      transition: background 0.05s, transform 0.05s;
    }
    .key-white:last-child {
      border-right: none;
    }
    .key-white:active, .key-white.pressed {
      background: linear-gradient(180deg, #e3dfd5 0%, #d4cfc4 100%);
      border-bottom-width: 1px;
      transform: translateY(1.5px);
    }

    .black-keys-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      pointer-events: none;
    }
    .key-black {
      position: absolute;
      width: 3.1%;
      height: 100%;
      background: linear-gradient(180deg, #2a2a2e 0%, #141416 85%, #08080a 100%);
      border-left: 1px solid #4a4a50;
      border-right: 1px solid #111;
      border-bottom: 2px solid #000;
      border-radius: 0 0 2px 2px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.25);
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.05s, transform 0.05s;
    }
    .key-black:active, .key-black.pressed {
      background: linear-gradient(180deg, #18181a 0%, #0c0c0d 100%);
      transform: translateY(1px);
    }

    /* Bottom Wood Apron / Lip */
    .wood-bottom-apron {
      height: 14px;
      background: linear-gradient(180deg, #200a04 0%, #4a1d10 40%, #2f1008 100%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 -1px 3px rgba(0,0,0,0.8);
      border-top: 1px solid #140502;
    }

    /* Subtitle & Specs Badge */
    .mockup-caption {
      margin-top: 16px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      gap: 16px;
    }
    .mockup-caption span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>

  <!-- 9:16 Aspect Ratio Frame -->
  <div class="viewport-frame">

    <div class="synth-chassis">
      
      <!-- Mahogany Wood Left End Cheek -->
      <div class="wood-left">
        <div class="wood-screw" style="top: 24px;"></div>
        <div class="wood-screw" style="top: 160px;"></div>
        <div class="wood-screw" style="top: 280px;"></div>
      </div>

      <!-- Mahogany Wood Right End Cheek -->
      <div class="wood-right">
        <div class="wood-screw" style="top: 24px;"></div>
        <div class="wood-screw" style="top: 160px;"></div>
        <div class="wood-screw" style="top: 280px;"></div>
      </div>

      <!-- Dark Brushed Metal Faceplate -->
      <div class="faceplate">
        
        <!-- Header Strip -->
        <div class="synth-header">
          <div class="logo-brand">Sequential Circuits Inc.</div>
          <div class="logo-model">
            Prophet-5
            <span class="logo-badge">Rev 3.3</span>
          </div>
        </div>

        <!-- Upper Control Panel Sections -->
        <div class="sections-grid">
          
          <!-- LFO / Poly-Mod Section -->
          <div class="synth-section">
            <div class="section-title">LFO / Mod</div>
            <div class="knobs-cluster">
              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(-45deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Freq</div>
              </div>

              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(20deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Amount</div>
              </div>
            </div>
          </div>

          <!-- Oscillators Section -->
          <div class="synth-section">
            <div class="section-title">Oscillator A</div>
            <div class="knobs-cluster">
              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(0deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Freq</div>
              </div>

              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(60deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">PW</div>
              </div>
            </div>
          </div>

          <!-- Filter Section -->
          <div class="synth-section">
            <div class="section-title">24dB Filter</div>
            <div class="knobs-cluster">
              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(45deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Cutoff</div>
              </div>

              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(-30deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Res</div>
              </div>
            </div>
          </div>

          <!-- Envelope Section -->
          <div class="synth-section">
            <div class="section-title">Envelope</div>
            <div class="knobs-cluster">
              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(-90deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Attack</div>
              </div>

              <div class="knob-unit">
                <div class="knob-dial-wrap">
                  <svg class="knob-ticks" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 3" stroke-width="1.2"/>
                  </svg>
                  <div class="knob-body" style="transform: rotate(30deg);"><div class="knob-indicator"></div></div>
                </div>
                <div class="knob-label">Release</div>
              </div>
            </div>
          </div>

          <!-- Program & Digital LED Window Strip -->
          <div class="preset-bar">
            <div class="preset-group">
              <div class="led-title">Bank / Program</div>
              <!-- Blank digital LED display window in resting state -->
              <div class="blank-led-display" title="Blank digital LED display window (resting state)"></div>
            </div>

            <div class="preset-buttons">
              <button class="synth-btn active">1</button>
              <button class="synth-btn">2</button>
              <button class="synth-btn">3</button>
              <button class="synth-btn">4</button>
              <button class="synth-btn">5</button>
              <button class="synth-btn">6</button>
              <button class="synth-btn">7</button>
              <button class="synth-btn">8</button>
            </div>
          </div>

        </div>

      </div>

      <!-- Lower Keyboard Shelf with Pitch & Mod Wheel Recess -->
      <div class="keyboard-shelf">
        
        <!-- Pitch / Mod Wheels -->
        <div class="wheels-bay">
          <div class="wheel-slot">
            <div class="wheel" id="pitchWheel"></div>
            <div class="wheel-lbl">Pitch</div>
          </div>
          <div class="wheel-slot">
            <div class="wheel" id="modWheel"></div>
            <div class="wheel-lbl">Mod</div>
          </div>
        </div>

        <!-- 3-Octave Piano Keyboard (37 Keys: 22 White Keys, 15 Black Keys) -->
        <div class="keyboard-container" id="synthKeyboard">
          
          <!-- 22 Clean Neutral White Keys in Resting State -->
          <div class="white-keys">
            <!-- Octave 1 (C2 - B2: 7 keys) -->
            <div class="key-white" data-note="65.41"></div>
            <div class="key-white" data-note="73.42"></div>
            <div class="key-white" data-note="82.41"></div>
            <div class="key-white" data-note="87.31"></div>
            <div class="key-white" data-note="98.00"></div>
            <div class="key-white" data-note="110.00"></div>
            <div class="key-white" data-note="123.47"></div>

            <!-- Octave 2 (C3 - B3: 7 keys) -->
            <div class="key-white" data-note="130.81"></div>
            <div class="key-white" data-note="146.83"></div>
            <div class="key-white" data-note="164.81"></div>
            <div class="key-white" data-note="174.61"></div>
            <div class="key-white" data-note="196.00"></div>
            <div class="key-white" data-note="220.00"></div>
            <div class="key-white" data-note="246.94"></div>

            <!-- Octave 3 (C4 - B4: 7 keys) -->
            <div class="key-white" data-note="261.63"></div>
            <div class="key-white" data-note="293.66"></div>
            <div class="key-white" data-note="329.63"></div>
            <div class="key-white" data-note="349.23"></div>
            <div class="key-white" data-note="392.00"></div>
            <div class="key-white" data-note="440.00"></div>
            <div class="key-white" data-note="493.88"></div>

            <!-- Final High C Key (C5: 1 key => total 22 white keys) -->
            <div class="key-white" data-note="523.25"></div>
          </div>

          <!-- 15 Matte Black Keys in Resting State -->
          <div class="black-keys-overlay">

  <!-- Interactive Web Audio Synth & Knob Dragging Logic -->
  <script>
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playNote(freq) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, ctx.currentTime);
        filter.Q.setValueAtTime(4, ctx.currentTime);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {
        console.error(e);
      }
    }

    // Attach Key Click Events
    document.querySelectorAll('.key-white, .key-black').forEach(key => {
      key.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        key.classList.add('pressed');
        const freq = parseFloat(key.getAttribute('data-note'));
        if (freq) playNote(freq);
      });
      key.addEventListener('mouseup', () => key.classList.remove('pressed'));
      key.addEventListener('mouseleave', () => key.classList.remove('pressed'));
    });

    // Interactive Knobs Dragging
    document.querySelectorAll('.knob-body').forEach(knob => {
      let isDragging = false;
      let startY = 0;
      let currentAngle = 0;

      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        const match = knob.style.transform.match(/rotate\(([-0.9]+)deg\)/);
        currentAngle = match ? parseFloat(match[1]) : 0;
        document.body.style.cursor = 'ns-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = startY - e.clientY;
        let newAngle = currentAngle + delta * 1.5;
        newAngle = Math.max(-135, Math.min(135, newAngle));
        knob.style.transform = `rotate(${newAngle}deg)`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = 'default';
        }
      });
    });

    // Preset Buttons Toggle
    document.querySelectorAll('.synth-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.synth-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
